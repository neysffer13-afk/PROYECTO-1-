.app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;padding:12px 14px 16px;position:relative}
.bar{display:flex;justify-content:space-between}
.bar button{background:var(--panel);color:var(--keytext);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;cursor:pointer}
.display{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:8px 6px 18px;min-height:0;overflow:hidden}
#expr{color:var(--dim);font-size:22px;min-height:30px;text-align:right;word-break:break-all}
#main{font-size:76px;font-weight:300;line-height:1.1;text-align:right;word-break:break-all;letter-spacing:-1px}
#main.m{font-size:54px}#main.s{font-size:38px}#main.err{font-size:24px;color:var(--err);font-weight:500}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.keys button{aspect-ratio:1/0.82;border:0;border-radius:26px;font-size:30px;font-family:inherit;background:var(--key);color:var(--keytext);cursor:pointer;transition:transform .09s ease,filter .09s ease;box-shadow:0 1px 0 var(--line)}
.keys button:active,.keys button.p{transform:scale(.92);filter:brightness(1.25)}
.keys .fn{background:var(--fn)}.keys .op{background:var(--op);color:var(--optext);font-size:34px}.keys .eq{background:var(--eq);color:var(--eqtext);font-size:34px}
.keys button:focus-visible,.bar button:focus-visible{outline:3px solid var(--eq);outline-offset:2px}
.mark{text-align:center;margin-top:12px;font-size:11px;letter-spacing:.5em;padding-left:.5em;color:var(--dim);opacity:.45;font-weight:500;user-select:none;pointer-events:none}
.hist{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;padding:14px;z-index:5}
.hist.open{display:flex}
.hist header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hist h2{margin:0;font-size:20px;font-weight:600}
.hist header button,.hist .clr{background:var(--panel);color:var(--keytext);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;cursor:pointer}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:right;cursor:pointer;color:var(--keytext);font-family:inherit}
.item small{display:block;color:var(--dim);font-size:16px;word-break:break-all}
.item b{font-size:26px;font-weight:500}
.empty{color:var(--dim);text-align:center;margin-top:40px}
.hist .clr{margin-top:10px;color:var(--err)}
@media (max-height:640px){#main{font-size:54px}.keys button{aspect-ratio:1/0.6;font-size:24px}}
@media (prefers-reduced-motion:reduce){.keys button{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button id="bHist" aria-label="Historial">Historial</button>
    <button id="bTheme" aria-label="Cambiar tema">Tema claro</button>
  </div>
  <div class="display"><div id="expr"></div><div id="main">0</div></div>
  <div class="keys" id="keys">
    <button class="fn" data-k="C">C</button><button class="fn" data-k="±">±</button><button class="fn" data-k="%">%</button><button class="op" data-k="÷">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="×">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="−">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
    <button class="fn" data-k="⌫" aria-label="Borrar último dígito">⌫</button><button data-k="0">0</button><button data-k=".">,</button><button class="eq" data-k="=">=</button>
  </div>
  <div class="mark" aria-hidden="true">MANUEL</div>
  <section class="hist" id="hist">
    <header><h2>Historial</h2><button id="bClose">Cerrar</button></header>
    <div id="list"></div>
    <button class="clr" id="bClear">Borrar historial</button>
  </section>
</div>

<script id="engine">
// ===== Motor de cálculo (sin eval) =====
var OPS = { '+':1, '−':1, '×':1, '÷':1 };
function isNum(t){ return /^-?\d*\.?\d+$|^-?\d+\.$/.test(t); }
function tokenize(arr){ return arr; }
// Parser recursivo: expr -> term (+|- term)*, term -> factor (×|÷ factor)*, factor -> num [%]
function evaluate(tokens){
  var i = 0;
  function factor(){
    var t = tokens[i];
    if(t === undefined || !isNum(t)) throw new Error('syntax');
    i++;
    var v = parseFloat(t), pct = false;
    if(tokens[i] === '%'){ v = v / 100; pct = true; i++; }
    return { v: v, pct: pct };
  }
  function term(){
    var f = factor(), v = f.v, single = f.pct;
    while(tokens[i] === '×' || tokens[i] === '÷'){
      var op = tokens[i++], r = factor();
      single = false;
      if(op === '×') v = v * r.v;
      else { if(r.v === 0) throw new Error('div0'); v = v / r.v; }
    }
    return { v: v, pct: single };
  }
  function expr(){
    var left = term().v;
    while(tokens[i] === '+' || tokens[i] === '−'){
      var op = tokens[i++], r = term();
      var rv = r.pct ? left * r.v : r.v; // 200 + 10% = 220
      left = op === '+' ? left + rv : left - rv;
    }
    return left;
  }
  var res = expr();
  if(i < tokens.length) throw new Error('syntax');
  return res;
}
// Evita errores binarios (0.1+0.2): redondea a 12 cifras significativas
function clean(x){
  if(!isFinite(x)) throw new Error('range');
  var n = Number(x.toPrecision(12));
  if(Object.is(n,-0)) n = 0;
  var s = String(n);
  if(/e/i.test(s)) s = n.toLocaleString('en-US',{useGrouping:false,maximumFractionDigits:12});
  return s;
}
</script>

<script>
(function(){
  var tokens = [], cur = '', done = false, err = '';
  var $ = function(id){ return document.getElementById(id); };
  var exprEl = $('expr'), mainEl = $('main');
  var history = [];

  function store(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

  function fmt(t){
    if(t === '' ) return '';
    if(!isNum(t) && t !== '-' && t !== '-0') return t;
    var neg = t[0] === '-', s = neg ? t.slice(1) : t, p = s.split('.');
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f');
    return (neg ? '-' : '') + p[0] + (p.length > 1 ? ',' + p[1] : '');
  }
  function show(){
    var m;
    if(err){ m = err; }
    else if(cur !== ''){ m = fmt(cur); }
    else {
      var last = ''; for(var j = tokens.length - 1; j >= 0; j--){ if(isNum(tokens[j])){ last = tokens[j]; break; } }
      m = last ? fmt(last) : '0';
    }
    mainEl.textContent = m;
    mainEl.className = err ? 'err' : (m.length > 14 ? 's' : m.length > 9 ? 'm' : '');
    exprEl.textContent = done ? '' : tokens.map(fmt).join(' ');
  }
  function resetIfDone(){ if(done){ tokens = []; cur = ''; done = false; } err = ''; }

  function digit(d){
    resetIfDone();
    if(tokens[tokens.length-1] === '%') return;
    if(cur.replace(/[-.]/g,'').length >= 15) return;
    if(cur === '0') cur = d; else if(cur === '-0') cur = '-' + d; else cur += d;
  }
  function dot(){
    resetIfDone();
    if(tokens[tokens.length-1] === '%') return;
    if(cur.indexOf('.') >= 0) return;
    cur = (cur === '' ? '0' : cur === '-' ? '-0' : cur) + '.';
  }
  function op(o){
    err = '';
    if(done){ tokens = []; done = false; }
    if(cur !== ''){
      if(cur[cur.length-1] === '.') cur = cur.slice(0,-1);
      tokens.push(cur); cur = ''; tokens.push(o);
    } else if(tokens.length === 0){ tokens.push('0', o); }
    else if(tokens[tokens.length-1] in OPS){ tokens[tokens.length-1] = o; }
    else tokens.push(o);
  }
  function pct(){
    err = '';
    if(done){ tokens = []; done = false; }
    if(cur !== ''){ if(cur[cur.length-1]==='.') cur = cur.slice(0,-1); tokens.push(cur); cur = ''; tokens.push('%'); }
  }
  function sign(){
    err = '';
    if(done){ tokens = []; done = false; }
    var l = tokens[tokens.length-1];
    if(cur !== ''){ cur = cur[0] === '-' ? cur.slice(1) : '-' + cur; }
    else if(tokens.length === 0 || l in OPS){ cur = '-0'; }
  }
  function back(){
    err = '';
    if(done){ clearAll(); return; }
    if(cur !== ''){ cur = cur.slice(0,-1); if(cur === '-') cur = ''; return; }
    if(tokens.length){
      var t = tokens.pop();
      if(!isNum(t) && tokens.length && isNum(tokens[tokens.length-1])) cur = tokens.pop();
    }
  }
  function clearAll(){ tokens = []; cur = ''; done = false; err = ''; }
  function equals(){
    if(err) return;
    var t = tokens.slice();
    if(cur !== ''){ t.push(cur[cur.length-1]==='.' ? cur.slice(0,-1) : cur); }
    while(t.length && (t[t.length-1] in OPS)) t.pop();
    if(!t.length || (t.length === 1 && t[0] === cur && done)) return;
    try{
      var r = clean(evaluate(t));
      history.unshift({ e: t, r: r });
      if(history.length > 100) history.pop();
      store('calc.history', JSON.stringify(history));
      tokens = []; cur = r; done = true; err = '';
    }catch(ex){
      err = ex.message === 'div0' ? 'No se puede dividir entre cero' : ex.message === 'range' ? 'Resultado fuera de rango' : 'Operación no válida';
      tokens = []; cur = ''; done = false;
    }
  }
  function press(k){
    if(k >= '0' && k <= '9' && k.length === 1) digit(k);
    else if(k === '.') dot();
    else if(k in OPS) op(k);
    else if(k === '%') pct();
    else if(k === '±') sign();
    else if(k === '⌫') back();
    else if(k === 'C') clearAll();
    else if(k === '=') equals();
    show();
  }

  // Botones
  $('keys').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(b) press(b.getAttribute('data-k'));
  });

  // Teclado físico
  var map = { '*':'×', 'x':'×', 'X':'×', '/':'÷', '-':'−', ',':'.', 'Enter':'=', '=':'=', 'Backspace':'⌫', 'Escape':'C', 'Delete':'C' };
  document.addEventListener('keydown', function(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    if($('hist').classList.contains('open')){ if(e.key === 'Escape') toggleHist(false); return; }
    var k = map[e.key] || e.key;
    var valid = /^[0-9.+%×÷−=⌫C]$/.test(k);
    if(!valid) return;
    e.preventDefault();
    press(k);
    var btn = document.querySelector('[data-k="' + k + '"]');
    if(btn){ btn.classList.add('p'); setTimeout(function(){ btn.classList.remove('p'); }, 110); }
  });

  // Historial
  function renderHist(){
    var l = $('list'); l.innerHTML = '';
    if(!history.length){ var d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Aún no hay operaciones. Pulsa = para guardarlas aquí.'; l.appendChild(d); return; }
    history.forEach(function(h){
      var b = document.createElement('button'); b.className = 'item';
      var s = document.createElement('small'); s.textContent = h.e.map(fmt).join(' ') + ' =';
      var r = document.createElement('b'); r.textContent = fmt(h.r);
      b.appendChild(s); b.appendChild(r);
      b.addEventListener('click', function(){
        tokens = h.e.slice(); cur = ''; done = false; err = '';
        if(isNum(tokens[tokens.length-1])) cur = tokens.pop();
        toggleHist(false); show();
      });
      l.appendChild(b);
    });
  }
  function toggleHist(o){ $('hist').classList.toggle('open', o); if(o) renderHist(); }
  $('bHist').addEventListener('click', function(){ toggleHist(true); });
  $('bClose').addEventListener('click', function(){ toggleHist(false); });
  $('bClear').addEventListener('click', function(){ history = []; store('calc.history', '[]'); renderHist(); });

  // Tema
  function setTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    $('bTheme').textContent = t === 'dark' ? 'Tema claro' : 'Tema oscuro';
    store('calc.theme', t);
  }
  $('bTheme').addEventListener('click', function(){
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  // Inicio
  try{ var h = JSON.parse(load('calc.history') || '[]'); if(Array.isArray(h)) history = h; }catch(e){}
  setTheme(load('calc.theme') === 'light' ? 'light' : 'dark');
  show();
})();
</script>
</body>
</html>
